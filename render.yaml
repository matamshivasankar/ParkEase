# Render Blueprint for ParkEase.
# Docs: https://render.com/docs/blueprint-spec
#
# Apply with: Render Dashboard -> New -> Blueprint -> select this repo.
# The PostgreSQL instance is wired into the web service automatically via
# `fromDatabase`; no connection string is ever committed to git.

services:
  - type: web
    name: parkease
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health

    # Root requirements.txt re-exports backend/requirements.txt.
    buildCommand: pip install -r requirements.txt

    # Flask-SocketIO uses async_mode='threading', so run a single Gunicorn
    # worker with many threads (the documented setup for threaded mode).
    # Multiple workers are not supported because rooms/connection state live
    # in process memory.
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 100 --timeout 120 run:app

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      # Render generates and stores these; they never live in the repo.
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: parkease-db
          property: connectionString
      # Optional: override the demo UPI merchant shown in the payment QR.
      - key: MERCHANT_UPI
        sync: false
      - key: MERCHANT_NAME
        value: ParkEase

databases:
  - name: parkease-db
    plan: free
    databaseName: parkease
    user: parkease
